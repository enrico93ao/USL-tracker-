<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USL Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-card { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(51, 65, 85, 0.8); }
        button, input, select { min-height: 48px; } /* Ottimizzato per touch mobile */
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <main class="max-w-xl mx-auto px-4 py-6 space-y-6">
        <header class="flex items-center justify-between pb-2">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">USL Tracker Pro</h1>
                <p class="text-xs text-slate-500">Gestione presenze e fatturato</p>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')" class="w-11 h-11 rounded-2xl bg-slate-200/80 dark:bg-slate-800 flex items-center justify-center text-slate-700 dark:text-slate-300">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            </button>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-4 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Ore Mese</p>
                <p class="text-2xl font-black mt-1 text-slate-800 dark:text-white" id="kpiMonthHours">0.00 <span class="text-xs font-normal">h</span></p>
            </div>
            <div class="glass-card p-4 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Fattura Stimata</p>
                <p class="text-2xl font-black mt-1 text-emerald-600 dark:text-emerald-400" id="kpiMonthAmount">€ 0.00</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Andamento Fatturato</h3>
                <select id="chartFilter" onchange="renderAll()" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 text-xs font-semibold focus:outline-none">
                    <option value="all">Tutto lo storico</option>
                    <option value="current">Mese Corrente</option>
                </select>
            </div>
            <div class="h-64 w-full relative">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- Entry Form -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-4">
            <h3 class="font-bold text-slate-800 dark:text-white text-sm">Registra Turno</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Data</label>
                <input type="date" id="inputDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Ingresso</label>
                    <input type="time" id="inputTimeIn" value="09:00" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Uscita</label>
                    <input type="time" id="inputTimeOut" value="17:00" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            <button onclick="addEntry()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/25 transition">Registra Turno</button>
        </div>

        <!-- Elenco Turni Recenti -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-3">
            <h3 class="font-bold text-slate-800 dark:text-white text-sm">Ultime Registrazioni</h3>
            <div id="entriesList" class="space-y-2 text-sm">
                <!-- Popolato via JS -->
            </div>
        </div>
    </main>

    <script>
        let entries = JSON.parse(localStorage.getItem('usl_pro_entries')) || [];
        const hourlyRate = 40.0;
        
        const historicalInvoices = [
            { ym: '2025-05', label: 'Mag 25', amount: 84.67 },
            { ym: '2025-06', label: 'Giu 25', amount: 2888.00 },
            { ym: '2025-07', label: 'Lug 25', amount: 3520.67 },
            { ym: '2025-08', label: 'Ago 25', amount: 3860.67 },
            { ym: '2025-09', label: 'Set 25', amount: 4454.67 },
            { ym: '2025-10', label: 'Ott 25', amount: 3985.33 },
            { ym: '2025-11', label: 'Nov 25', amount: 3562.67 },
            { ym: '2025-12', label: 'Dic 25', amount: 3958.67 },
            { ym: '2026-01', label: 'Gen 26', amount: 3536.00 },
            { ym: '2026-02', label: 'Feb 26', amount: 4016.00 },
            { ym: '2026-03', label: 'Mar 26', amount: 4847.33 },
            { ym: '2026-04', label: 'Apr 26', amount: 4500.67 },
            { ym: '2026-05', label: 'Mag 26', amount: 4403.33 },
            { ym: '2026-06', label: 'Giu 26', amount: 3928.67 },
            { ym: '2026-07', label: 'Lug 26', amount: 3214.67 }
        ];

        document.getElementById('inputDate').valueAsDate = new Date();
        let chartInstance = null;

        function addEntry() {
            const date = document.getElementById('inputDate').value;
            const timeIn = document.getElementById('inputTimeIn').value;
            const timeOut = document.getElementById('inputTimeOut').value;

            if(!date || !timeIn || !timeOut) return;

            const [hIn, mIn] = timeIn.split(':').map(Number);
            const [hOut, mOut] = timeOut.split(':').map(Number);
            const diffHours = ((hOut * 60 + mOut) - (hIn * 60 + mIn)) / 60;

            if (diffHours <= 0) {
                alert("L'orario di uscita deve essere successivo a quello di ingresso.");
                return;
            }

            entries.push({ id: Date.now(), date, timeIn, timeOut, hours: diffHours });
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));
            renderAll();
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));
            renderAll();
        }

        function renderAll() {
            const currentMonthYM = new Date().toISOString().slice(0, 7);
            let totalMonthHours = 0;

            const listContainer = document.getElementById('entriesList');
            listContainer.innerHTML = '';

            entries.forEach(e => {
                if (e.date.startsWith(currentMonthYM)) {
                    totalMonthHours += e.hours;
                }
            });

            const recentEntries = entries.slice(0, 5);
            if (recentEntries.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 text-center py-2">Nessun turno registrato</p>`;
            } else {
                recentEntries.forEach(e => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800";
                    div.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800 dark:text-slate-200">${e.date} (${e.timeIn} - ${e.timeOut})</p>
                            <p class="text-xs text-slate-500">${e.hours.toFixed(2)} ore</p>
                        </div>
                        <button onclick="deleteEntry(${e.id})" class="text-rose-500 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    `;
                    listContainer.appendChild(div);
                });
            }

            const monthAmount = totalMonthHours * hourlyRate;
            document.getElementById('kpiMonthHours').innerHTML = `${totalMonthHours.toFixed(2)} <span class="text-xs font-normal">h</span>`;
            document.getElementById('kpiMonthAmount').innerText = `€ ${monthAmount.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            renderChart();
        }

        function renderChart() {
            const filter = document.getElementById('chartFilter').value;
            const currentMonthYM = new Date().toISOString().slice(0, 7);

            let mapAmounts = {};
            historicalInvoices.forEach(h => { mapAmounts[h.ym] = h.amount; });

            entries.forEach(e => {
                const ym = e.date.slice(0, 7);
                if (!mapAmounts[ym]) mapAmounts[ym] = 0;
                mapAmounts[ym] += e.hours * hourlyRate;
            });

            let allYMs = Object.keys(mapAmounts).sort();
            if (filter === 'current') {
                allYMs = allYMs.filter(ym => ym === currentMonthYM);
            }

            const labels = allYMs.map(ym => {
                const [y, m] = ym.split('-');
                return new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'short', year: '2-digit' });
            });
            const dataValues = allYMs.map(ym => mapAmounts[ym]);

            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Fatturato (€)',
                        data: dataValues,
                        backgroundColor: '#2563eb',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                        y: { beginAtZero: true, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        renderAll();
    </script>
</body>
</html>
