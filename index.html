<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USL Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background-color: #f5f5f7; }
        .apple-card { background: #ffffff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .dark .apple-card { background: #1c1c1e; box-shadow: none; }
        input, button { transition: all 0.2s ease; }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen">

    <main class="max-w-md mx-auto px-4 py-8 space-y-6">
        <header class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight">USL Pro</h1>
            <p class="text-slate-500 text-sm">Resoconto attività</p>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 gap-4">
            <div class="apple-card p-5">
                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Fatturato Mese</p>
                <p class="text-xl font-bold mt-1" id="kpiMonthAmount">€ 0</p>
            </div>
            <div class="apple-card p-5">
                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Residuo Fondo</p>
                <p class="text-xl font-bold mt-1 text-blue-600" id="kpiRemainingFunds">€ 0</p>
            </div>
        </div>

        <!-- Form Inserimento -->
        <div class="apple-card p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-semibold text-sm">Nuova Registrazione</h3>
            </div>
            <input type="date" id="inputDate" class="w-full bg-slate-100 dark:bg-slate-800 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-blue-500">
            
            <div class="grid grid-cols-2 gap-3">
                <input type="number" id="inputDirectHours" placeholder="Ore" class="bg-slate-100 dark:bg-slate-800 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="inputDirectMinutes" placeholder="Minuti" class="bg-slate-100 dark:bg-slate-800 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="addDirectHours()" class="w-full bg-slate-900 dark:bg-white text-white dark:text-black font-semibold py-3 rounded-xl hover:opacity-90 active:scale-95 transition-all">
                Aggiungi Dati
            </button>
        </div>

        <!-- Lista -->
        <div class="apple-card p-5">
            <h3 class="font-semibold text-sm mb-4">Storico Recente</h3>
            <div id="entriesList" class="space-y-3"></div>
        </div>
    </main>

    <script>
        let entries = JSON.parse(localStorage.getItem('usl_pro_entries')) || [];
        const hourlyRate = 40.0;
        const totalInitialBudget = 37398.00;
        const historicalInvoices = [
            { ym: '2025-05', amount: 84.67 }, { ym: '2025-06', amount: 2888.00 }, { ym: '2025-07', amount: 3520.67 },
            { ym: '2025-08', amount: 3860.67 }, { ym: '2025-09', amount: 4454.67 }, { ym: '2025-10', amount: 3985.33 },
            { ym: '2025-11', amount: 3562.67 }, { ym: '2025-12', amount: 3958.67 }, { ym: '2026-01', amount: 3536.00 },
            { ym: '2026-02', amount: 4016.00 }, { ym: '2026-03', amount: 4847.33 }, { ym: '2026-04', amount: 4500.67 },
            { ym: '2026-05', amount: 4403.33 }, { ym: '2026-06', amount: 3928.67 }, { ym: '2026-07', amount: 3214.67 }
        ];

        document.getElementById('inputDate').valueAsDate = new Date();

        function calculateStats() {
            const historicalTotal = historicalInvoices.reduce((sum, item) => sum + item.amount, 0);
            const appTotal = entries.reduce((acc, curr) => acc + (curr.hours * hourlyRate), 0);
            const totalBilled = historicalTotal + appTotal;
            const remaining = totalInitialBudget - totalBilled;
            
            const currentMonthYM = new Date().toISOString().slice(0, 7);
            const monthEntries = entries.filter(e => e.date.startsWith(currentMonthYM));
            const monthAppAmount = monthEntries.reduce((sum, e) => sum + (e.hours * hourlyRate), 0);
            const monthHistAmount = historicalInvoices.find(h => h.ym === currentMonthYM)?.amount || 0;

            return { remaining, monthAmount: monthAppAmount + monthHistAmount };
        }

        function addDirectHours() {
            const date = document.getElementById('inputDate').value;
            const hours = parseInt(document.getElementById('inputDirectHours').value) || 0;
            const minutes = parseInt(document.getElementById('inputDirectMinutes').value) || 0;
            const totalHours = hours + (minutes / 60);

            if (!date || totalHours <= 0) return alert("Inserisci dati validi");

            entries.push({ id: Date.now(), date, hours: totalHours });
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));
            render();
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));
            render();
        }

        function render() {
            const { remaining, monthAmount } = calculateStats();
            document.getElementById('kpiMonthAmount').innerText = `€ ${monthAmount.toLocaleString('it-IT', {maximumFractionDigits: 0})}`;
            document.getElementById('kpiRemainingFunds').innerText = `€ ${remaining.toLocaleString('it-IT', {maximumFractionDigits: 0})}`;
            
            const list = document.getElementById('entriesList');
            list.innerHTML = entries.slice().reverse().map(e => `
                <div class="flex justify-between items-center py-2 border-b border-slate-100 dark:border-slate-800">
                    <div>
                        <p class="text-sm font-medium">${e.date}</p>
                        <p class="text-xs text-slate-400">${e.hours.toFixed(2)} ore</p>
                    </div>
                    <button onclick="deleteEntry(${e.id})" class="text-rose-500 text-xs">Elimina</button>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
