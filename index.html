<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USL Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-card { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(51, 65, 85, 0.8); }
        button, input, select { min-height: 48px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <main class="max-w-xl mx-auto px-4 py-6 space-y-6">
        <header class="flex items-center justify-between pb-2">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">USL Tracker Pro</h1>
                <p class="text-xs text-slate-500">Gestione presenze e fatturato</p>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')" class="w-11 h-11 rounded-2xl bg-slate-200/80 dark:bg-slate-800 flex items-center justify-center text-slate-700 dark:text-slate-300">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            </button>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-3 gap-3">
            <div class="glass-card p-3 rounded-2xl shadow-sm">
                <p class="text-[10px] font-semibold text-slate-500 uppercase">Ore Mese</p>
                <p class="text-lg font-black mt-1 text-slate-800 dark:text-white" id="kpiMonthHours">0.00</p>
            </div>
            <div class="glass-card p-3 rounded-2xl shadow-sm">
                <p class="text-[10px] font-semibold text-slate-500 uppercase">Fattura</p>
                <p class="text-lg font-black mt-1 text-emerald-600 dark:text-emerald-400" id="kpiMonthAmount">€ 0</p>
            </div>
            <div class="glass-card p-3 rounded-2xl shadow-sm">
                <p class="text-[10px] font-semibold text-slate-500 uppercase">Residuo</p>
                <p class="text-lg font-black mt-1 text-indigo-600 dark:text-indigo-400" id="kpiRemainingFunds">€ 37.398</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Andamento Fatturato</h3>
                <select id="chartFilter" onchange="renderAll()" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 text-xs font-semibold focus:outline-none">
                    <option value="all">Tutto lo storico</option>
                    <option value="current">Mese Corrente</option>
                </select>
            </div>
            <div class="h-60 w-full relative">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- Entry Form (Ingresso / Uscita Separati) -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Timbratura Turno</h3>
                <span id="activeClockStatus" class="text-xs font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500">Pronto</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Data</label>
                <input type="date" id="inputDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-sm focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="recordIn()" id="btnIngresso" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Registra Ingresso</span>
                </button>
                <button onclick="recordOut()" id="btnUscita" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 opacity-60 cursor-not-allowed" disabled>
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Registra Uscita</span>
                </button>
            </div>
        </div>

        <!-- Storico Registrazioni con Filtro Mese -->
        <div class="glass-card p-5 rounded-2xl shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Registrazioni Mese</h3>
                <input type="month" id="filterMonth" onchange="renderAll()" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 text-xs font-semibold focus:outline-none">
            </div>
            <div id="entriesList" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-1">
                <!-- Popolato via JS -->
            </div>
        </div>
    </main>

    <script>
        let entries = JSON.parse(localStorage.getItem('usl_pro_entries')) || [];
        let activeShift = JSON.parse(localStorage.getItem('usl_active_shift')) || null;
        const hourlyRate = 40.0;
        let initialFunds = 37398.0;

        const historicalInvoices = [
            { ym: '2025-05', amount: 84.67 }, { ym: '2025-06', amount: 2888.00 }, { ym: '2025-07', amount: 3520.67 },
            { ym: '2025-08', amount: 3860.67 }, { ym: '2025-09', amount: 4454.67 }, { ym: '2025-10', amount: 3985.33 },
            { ym: '2025-11', amount: 3562.67 }, { ym: '2025-12', amount: 3958.67 }, { ym: '2026-01', amount: 3536.00 },
            { ym: '2026-02', amount: 4016.00 }, { ym: '2026-03', amount: 4847.33 }, { ym: '2026-04', amount: 4500.67 },
            { ym: '2026-05', amount: 4403.33 }, { ym: '2026-06', amount: 3928.67 }, { ym: '2026-07', amount: 3214.67 }
        ];

        document.getElementById('inputDate').valueAsDate = new Date();
        document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);
        let chartInstance = null;

        function updateShiftUI() {
            const btnIn = document.getElementById('btnIngresso');
            const btnOut = document.getElementById('btnUscita');
            const status = document.getElementById('activeClockStatus');

            if (activeShift) {
                btnIn.disabled = true;
                btnIn.classList.add('opacity-60', 'cursor-not-allowed');
                btnOut.disabled = false;
                btnOut.classList.remove('opacity-60', 'cursor-not-allowed');
                status.innerText = `In servizio dalle ${activeShift.timeIn}`;
                status.className = "text-xs font-semibold px-2 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 rounded-lg";
            } else {
                btnIn.disabled = false;
                btnIn.classList.remove('opacity-60', 'cursor-not-allowed');
                btnOut.disabled = true;
                btnOut.classList.add('opacity-60', 'cursor-not-allowed');
                status.innerText = "Pronto";
                status.className = "text-xs font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500";
            }
        }

        function recordIn() {
            const date = document.getElementById('inputDate').value;
            const now = new Date();
            const timeIn = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            activeShift = { date, timeIn };
            localStorage.setItem('usl_active_shift', JSON.stringify(activeShift));
            updateShiftUI();
        }

        function recordOut() {
            if (!activeShift) return;
            const now = new Date();
            const timeOut = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const [hIn, mIn] = activeShift.timeIn.split(':').map(Number);
            const [hOut, mOut] = timeOut.split(':').map(Number);
            const diffHours = ((hOut * 60 + mOut) - (hIn * 60 + mIn)) / 60;

            if (diffHours <= 0) {
                alert("L'orario di uscita non può essere precedente o uguale a quello di ingresso.");
                return;
            }

            entries.push({ id: Date.now(), date: activeShift.date, timeIn: activeShift.timeIn, timeOut, hours: diffHours });
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));

            activeShift = null;
            localStorage.removeItem('usl_active_shift');
            updateShiftUI();
            renderAll();
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('usl_pro_entries', JSON.stringify(entries));
            renderAll();
        }

        function renderAll() {
            const selectedMonth = document.getElementById('filterMonth').value;
            let totalMonthHours = 0;
            let totalHistoricalBilled = 0;

            historicalInvoices.forEach(h => { totalHistoricalBilled += h.amount; });

            const listContainer = document.getElementById('entriesList');
            listContainer.innerHTML = '';

            let filteredEntries = entries.filter(e => e.date.startsWith(selectedMonth));

            entries.forEach(e => {
                if (e.date.startsWith(new Date().toISOString().slice(0, 7))) {
                    totalMonthHours += e.hours;
                }
            });

            // Calcolo totale fatturato attuale per il residuo
            let totalUserBilled = entries.reduce((acc, curr) => acc + (curr.hours * hourlyRate), 0);
            let remaining = initialFunds - totalUserBilled;

            if (filteredEntries.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 text-center py-3 text-xs">Nessuna registrazione per il mese selezionato</p>`;
            } else {
                filteredEntries.forEach(e => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800";
                    div.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800 dark:text-slate-200">${e.date} &bull; <span class="text-blue-600">${e.timeIn} - ${e.timeOut}</span></p>
                            <p class="text-xs text-slate-500">${e.hours.toFixed(2)} ore (€ ${(e.hours * hourlyRate).toFixed(2)})</p>
                        </div>
                        <button onclick="deleteEntry(${e.id})" class="text-rose-500 p-2 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition"><i class="fa-solid fa-trash-can"></i></button>
                    `;
                    listContainer.appendChild(div);
                });
            }

            const monthAmount = totalMonthHours * hourlyRate;
            document.getElementById('kpiMonthHours').innerHTML = `${totalMonthHours.toFixed(2)}`;
            document.getElementById('kpiMonthAmount').innerText = `€ ${monthAmount.toLocaleString('it-IT', {maximumFractionDigits: 0})}`;
            document.getElementById('kpiRemainingFunds').innerText = `€ ${remaining.toLocaleString('it-IT', {maximumFractionDigits: 0})}`;

            renderChart();
        }

        function renderChart() {
            const filter = document.getElementById('chartFilter').value;
            const currentMonthYM = new Date().toISOString().slice(0, 7);

            let mapAmounts = {};
            historicalInvoices.forEach(h => { mapAmounts[h.ym] = h.amount; });

            entries.forEach(e => {
                const ym = e.date.slice(0, 7);
                if (!mapAmounts[ym]) mapAmounts[ym] = 0;
                mapAmounts[ym] += e.hours * hourlyRate;
            });

            let allYMs = Object.keys(mapAmounts).sort();
            if (filter === 'current') {
                allYMs = allYMs.filter(ym => ym === currentMonthYM);
            }

            const labels = allYMs.map(ym => {
                const [y, m] = ym.split('-');
                return new Date(y, m - 1, 1).toLocaleDateString('it-IT', { month: 'short', year: '2-digit' });
            });
            const dataValues = allYMs.map(ym => mapAmounts[ym]);

            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Fatturato (€)',
                        data: dataValues,
                        backgroundColor: 'rgba(37, 99, 235, 0.85)',
                        borderColor: 'rgb(37, 99, 235)',
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                        y: { beginAtZero: true, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        updateShiftUI();
        renderAll();
    </script>
</body>
</html>
