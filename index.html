<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolo Fattura CogniLab</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Stile Bottoni */
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        .btn-custom {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-entrata { background-color: #28a745; }
        .btn-entrata:hover { background-color: #218838; transform: translateY(-2px); }
        .btn-uscita { background-color: #dc3545; }
        .btn-uscita:hover { background-color: #c82333; transform: translateY(-2px); }
        
        #risultato { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h3>Calcolo Fattura Rapido</h3>
    
    <div class="input-group">
        <label for="ore">Ore lavorate:</label>
        <input type="number" id="ore" min="0" value="0">
    </div>

    <div class="input-group">
        <label for="minuti">Minuti:</label>
        <input type="number" id="minuti" min="0" max="59" value="0">
    </div>

    <button class="btn-custom btn-entrata" onclick="calcolaFattura()" style="width: 100%;">CALCOLA IMPORTO</button>
    
    <div id="risultato">Totale Fattura: 0,00 €</div>

    <div class="btn-container">
        <button class="btn-custom btn-entrata">ENTRATA</button>
        <button class="btn-custom btn-uscita">USCITA</button>
    </div>
</div>

<script>
    function calcolaFattura() {
        // Imposta qui la tua tariffa oraria di riferimento
        const tariffaOraria = 40; 
        
        const ore = parseInt(document.getElementById('ore').value) || 0;
        const minuti = parseInt(document.getElementById('minuti').value) || 0;

        // Conversione precisa del tempo in decimale (ore + frazione di ora)
        const oreTotali = ore + (minuti / 60);

        // Calcolo importo
        const totale = oreTotali * tariffaOraria;

        // Aggiornamento interfaccia
        document.getElementById('risultato').innerText = 
            "Totale Fattura: " + totale.toFixed(2) + " €";
    }
</script>

</body>
</html>
